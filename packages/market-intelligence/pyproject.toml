[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pillalu-intel"
version = "0.1.0"
description = "Pillalú Money Engine: importación de Dropi, inteligencia de mercado y generación de publicaciones"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
# Cliente del MCP oficial de Dropi. Se fija la serie 1.x del SDK oficial de MCP.
dropi = ["mcp>=1.26,<2"]
dev = ["pytest>=8"]

[project.scripts]
pillalu-intel = "pillalu_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
